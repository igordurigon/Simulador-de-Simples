server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /saude { access_log off; return 200 "ok\n"; }

  # Arquivos com hash no nome: cache longo
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # index.html nunca em cache, para a versão nova aparecer logo após o deploy
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
